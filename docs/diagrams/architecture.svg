<svg xmlns="http://www.w3.org/2000/svg" width="1560" height="900" viewBox="0 0 1560 900" font-family="Segoe UI,Inter,system-ui,-apple-system,sans-serif"><defs><marker id="ah-green" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1.2 L9,5 L0,8.8 z" fill="#2f9e6e"/></marker><marker id="ah-pink" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1.2 L9,5 L0,8.8 z" fill="#e05561"/></marker><marker id="ah-blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1.2 L9,5 L0,8.8 z" fill="#4285f4"/></marker><marker id="ah-purple" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1.2 L9,5 L0,8.8 z" fill="#8b5cf6"/></marker><marker id="ah-amber" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1.2 L9,5 L0,8.8 z" fill="#e0a13a"/></marker><marker id="ah-cyan" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1.2 L9,5 L0,8.8 z" fill="#2aa5b0"/></marker><marker id="ah-slate" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1.2 L9,5 L0,8.8 z" fill="#8494ab"/></marker><marker id="ah-white" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1.2 L9,5 L0,8.8 z" fill="#c9d3e2"/></marker><filter id="sh" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#1b2a4a" flood-opacity="0.10"/></filter></defs><rect width="1560" height="900" fill="#fbfcfe"/><text x="780.0" y="52" text-anchor="middle" font-size="27" font-weight="700" fill="#16203a">SchemaGuard - breaking-change gate</text><text x="780.0" y="80" text-anchor="middle" font-size="14.5" fill="#6b7794">Diff two schema versions, classify every change against the backward-compatibility rules, then fail the PR on a break.</text><rect x="50" y="175" width="300" height="232" rx="18" fill="#ffffff" fill-opacity="0.55" stroke="#8494ab" stroke-width="1.5" stroke-dasharray="7 5" stroke-opacity="0.75"/><text x="68" y="166" font-size="13.5" font-weight="700" letter-spacing="0.4" fill="#3d4a63">1 - SCHEMAS IN</text><rect x="70" y="207" width="260" height="69" rx="14" fill="#ddf3f5" stroke="#2aa5b0" stroke-width="1.8" filter="url(#sh)"/><g transform="translate(86,222) scale(0.8750)" fill="none" stroke="#2aa5b0" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/><path d="M9 13h6"/><path d="M9 17h4"/></g><text x="116" y="238" font-size="16.5" font-weight="700" fill="#136b74">Old schema</text><text x="87" y="260.0" font-size="12.3" fill="#6b7794" font-family="Segoe UI,Inter,system-ui,-apple-system,sans-serif">the baseline version</text><rect x="70" y="291" width="260" height="69" rx="14" fill="#ddf3f5" stroke="#2aa5b0" stroke-width="1.8" filter="url(#sh)"/><g transform="translate(86,306) scale(0.8750)" fill="none" stroke="#2aa5b0" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/><path d="M9 13h6"/><path d="M9 17h4"/></g><text x="116" y="322" font-size="16.5" font-weight="700" fill="#136b74">New schema</text><text x="87" y="344.0" font-size="12.3" fill="#6b7794" font-family="Segoe UI,Inter,system-ui,-apple-system,sans-serif">the proposed version</text><rect x="456" y="220" width="240" height="155" rx="14" fill="#ece5f9" stroke="#8b5cf6" stroke-width="1.8" filter="url(#sh)"/><g transform="translate(472,235) scale(0.8750)" fill="none" stroke="#8b5cf6" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3v4a4 4 0 0 0 4 4h8"/><path d="M6 21v-4a4 4 0 0 1 4-4h8"/><path d="M15 8l3 3-3 3"/><path d="M15 14l3 3-3 3"/></g><text x="502" y="251" font-size="16.5" font-weight="700" fill="#552fae">Diff old vs new</text><text x="473" y="273.0" font-size="12.3" fill="#6b7794" font-family="Segoe UI,Inter,system-ui,-apple-system,sans-serif">field: name, type,</text><text x="473" y="290.8" font-size="12.3" fill="#6b7794" font-family="Segoe UI,Inter,system-ui,-apple-system,sans-serif">required flag</text><text x="473" y="308.6" font-size="12.3" fill="#6b7794" font-family="Segoe UI,Inter,system-ui,-apple-system,sans-serif">walk old, then new</text><text x="473" y="326.4" font-size="12.3" fill="#6b7794" font-family="Segoe UI,Inter,system-ui,-apple-system,sans-serif">pure - no file I/O</text><rect x="802" y="220" width="240" height="155" rx="14" fill="#fde5e7" stroke="#e05561" stroke-width="1.8" filter="url(#sh)"/><g transform="translate(818,235) scale(0.8750)" fill="none" stroke="#e05561" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v16"/><path d="M6 8h12"/><path d="M4 18h6l-3-7z"/><path d="M14 18h6l-3-7z"/></g><text x="848" y="251" font-size="16.5" font-weight="700" fill="#9e2b36">Tag each change</text><text x="819" y="273.0" font-size="12.3" fill="#6b7794" font-family="Segoe UI,Inter,system-ui,-apple-system,sans-serif">apply the six rules</text><text x="819" y="290.8" font-size="12.3" fill="#6b7794" font-family="Segoe UI,Inter,system-ui,-apple-system,sans-serif">SAFE or BREAKING</text><text x="819" y="308.6" font-size="12.3" fill="#6b7794" font-family="Segoe UI,Inter,system-ui,-apple-system,sans-serif">type &amp; required:</text><text x="819" y="326.4" font-size="12.3" fill="#6b7794" font-family="Segoe UI,Inter,system-ui,-apple-system,sans-serif">two independent checks</text><rect x="1150" y="175" width="360" height="300" rx="18" fill="#ffffff" fill-opacity="0.55" stroke="#8494ab" stroke-width="1.5" stroke-dasharray="7 5" stroke-opacity="0.75"/><text x="1168" y="166" font-size="13.5" font-weight="700" letter-spacing="0.4" fill="#3d4a63">THE RULEBOOK</text><rect x="1170" y="207" width="320" height="122" rx="14" fill="#fde5e7" stroke="#e05561" stroke-width="1.8" filter="url(#sh)"/><g transform="translate(1186,222) scale(0.8750)" fill="none" stroke="#e05561" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M9 9l6 6M15 9l-6 6"/></g><text x="1216" y="238" font-size="16.5" font-weight="700" fill="#9e2b36">Breaking - fails PR</text><text x="1187" y="260.0" font-size="12.3" fill="#6b7794" font-family="Segoe UI,Inter,system-ui,-apple-system,sans-serif">remove a field</text><text x="1187" y="277.8" font-size="12.3" fill="#6b7794" font-family="Segoe UI,Inter,system-ui,-apple-system,sans-serif">add a required field</text><text x="1187" y="295.6" font-size="12.3" fill="#6b7794" font-family="Segoe UI,Inter,system-ui,-apple-system,sans-serif">change a field's type</text><text x="1187" y="313.4" font-size="12.3" fill="#6b7794" font-family="Segoe UI,Inter,system-ui,-apple-system,sans-serif">optional -&gt; required</text><rect x="1170" y="341" width="320" height="110" rx="14" fill="#e3f5ec" stroke="#2f9e6e" stroke-width="1.8" filter="url(#sh)"/><g transform="translate(1186,356) scale(0.8750)" fill="none" stroke="#2f9e6e" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M8 12.5l2.6 2.6L16 9.6"/></g><text x="1216" y="372" font-size="16.5" font-weight="700" fill="#186547">Safe - merges</text><text x="1187" y="394.0" font-size="12.3" fill="#6b7794" font-family="Segoe UI,Inter,system-ui,-apple-system,sans-serif">add an optional field</text><text x="1187" y="411.8" font-size="12.3" fill="#6b7794" font-family="Segoe UI,Inter,system-ui,-apple-system,sans-serif">required -&gt; optional</text><path d="M350,241 L454,288" stroke="#2aa5b0" stroke-width="2.0" fill="none" marker-end="url(#ah-cyan)"/><path d="M350,325 L454,306" stroke="#2aa5b0" stroke-width="2.0" fill="none" marker-end="url(#ah-cyan)"/><rect x="379.112" y="303.5" width="45.775999999999996" height="24.0" rx="12" fill="#ffffff" stroke="#2aa5b0" stroke-opacity="0.4"/><text x="402.0" y="319.94" text-anchor="middle" font-size="12" font-weight="600" fill="#136b74">both</text><path d="M696,297 L800,297" stroke="#8b5cf6" stroke-width="2.0" fill="none" marker-end="url(#ah-purple)"/><rect x="712.8" y="285.0" width="70.4" height="24.0" rx="12" fill="#ffffff" stroke="#8b5cf6" stroke-opacity="0.4"/><text x="748.0" y="301.44" text-anchor="middle" font-size="12" font-weight="600" fill="#552fae">changes</text><path d="M1042,297 L1148,297" stroke="#e05561" stroke-width="2.0" fill="none" marker-end="url(#ah-pink)"/><rect x="1060.736" y="285.0" width="68.52799999999999" height="24.0" rx="12" fill="#ffffff" stroke="#e05561" stroke-opacity="0.4"/><text x="1095.0" y="301.44" text-anchor="middle" font-size="12" font-weight="600" fill="#9e2b36">classify</text><rect x="802" y="555" width="240" height="150" rx="14" fill="#e2ecfd" stroke="#4285f4" stroke-width="1.8" filter="url(#sh)"/><g transform="translate(818,570) scale(0.8750)" fill="none" stroke="#4285f4" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l9 5-9 5-9-5z"/><path d="M3 13l9 5 9-5"/></g><text x="848" y="586" font-size="16.5" font-weight="700" fill="#17509f">Stable sort</text><text x="819" y="608.0" font-size="12.3" fill="#6b7794" font-family="Segoe UI,Inter,system-ui,-apple-system,sans-serif">breaking first,</text><text x="819" y="625.8" font-size="12.3" fill="#6b7794" font-family="Segoe UI,Inter,system-ui,-apple-system,sans-serif">then field name</text><text x="819" y="643.6" font-size="12.3" fill="#6b7794" font-family="Segoe UI,Inter,system-ui,-apple-system,sans-serif">ties keep order</text><rect x="456" y="555" width="240" height="150" rx="14" fill="#fdf1d6" stroke="#e0a13a" stroke-width="1.8" filter="url(#sh)"/><g transform="translate(472,570) scale(0.8750)" fill="none" stroke="#e0a13a" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="10" width="16" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></g><text x="502" y="586" font-size="16.5" font-weight="700" fill="#8c5a0d">CI gate</text><text x="473" y="608.0" font-size="12.3" fill="#6b7794" font-family="Consolas,ui-monospace,Menlo,monospace">has_breaking(changes)</text><text x="473" y="625.8" font-size="12.3" fill="#6b7794" font-family="Consolas,ui-monospace,Menlo,monospace">any breaking: exit 1</text><text x="473" y="643.6" font-size="12.3" fill="#6b7794" font-family="Consolas,ui-monospace,Menlo,monospace">else:         exit 0</text><rect x="70" y="555" width="300" height="70" rx="14" fill="#fde5e7" stroke="#e05561" stroke-width="1.8" filter="url(#sh)"/><g transform="translate(86,570) scale(0.8750)" fill="none" stroke="#e05561" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l9 16H3z"/><path d="M12 9v5"/><path d="M12 17.2v.1"/></g><text x="116" y="586" font-size="16.5" font-weight="700" fill="#9e2b36">Fail the PR</text><text x="87" y="608.0" font-size="12.3" fill="#6b7794" font-family="Segoe UI,Inter,system-ui,-apple-system,sans-serif">exit 1 - a break exists</text><rect x="70" y="637" width="300" height="70" rx="14" fill="#e3f5ec" stroke="#2f9e6e" stroke-width="1.8" filter="url(#sh)"/><g transform="translate(86,652) scale(0.8750)" fill="none" stroke="#2f9e6e" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M8 12.5l2.6 2.6L16 9.6"/></g><text x="116" y="668" font-size="16.5" font-weight="700" fill="#186547">Merge</text><text x="87" y="690.0" font-size="12.3" fill="#6b7794" font-family="Segoe UI,Inter,system-ui,-apple-system,sans-serif">exit 0 - all safe or none</text><path d="M922,375 L922,553" stroke="#e05561" stroke-width="2.0" fill="none" marker-end="url(#ah-pink)"/><rect x="891.912" y="452.0" width="60.176" height="24.0" rx="12" fill="#ffffff" stroke="#e05561" stroke-opacity="0.4"/><text x="922.0" y="468.44" text-anchor="middle" font-size="12" font-weight="600" fill="#9e2b36">tagged</text><path d="M800,630 L698,630" stroke="#4285f4" stroke-width="2.0" fill="none" marker-end="url(#ah-blue)"/><rect x="718.912" y="618.0" width="60.176" height="24.0" rx="12" fill="#ffffff" stroke="#4285f4" stroke-opacity="0.4"/><text x="749.0" y="634.44" text-anchor="middle" font-size="12" font-weight="600" fill="#17509f">sorted</text><path d="M454,605 L372,588" stroke="#e05561" stroke-width="2.0" fill="none" marker-end="url(#ah-pink)"/><rect x="385.0" y="584.5" width="56.0" height="24.0" rx="12" fill="#ffffff" stroke="#e05561" stroke-opacity="0.4"/><text x="413.0" y="600.94" text-anchor="middle" font-size="12" font-weight="600" fill="#9e2b36">break</text><path d="M454,650 L372,668" stroke="#2f9e6e" stroke-width="2.0" fill="none" marker-end="url(#ah-green)"/><rect x="390.112" y="647.0" width="45.775999999999996" height="24.0" rx="12" fill="#ffffff" stroke="#2f9e6e" stroke-opacity="0.4"/><text x="413.0" y="663.44" text-anchor="middle" font-size="12" font-weight="600" fill="#186547">safe</text><rect x="50" y="745" width="710" height="95.19999999999999" rx="11" fill="#eef1f6" stroke="#8494ab" stroke-width="1.4" stroke-opacity="0.8"/><text x="66" y="769" font-size="13.2" font-weight="700" fill="#3d4a63">One field, two changes</text><text x="66" y="791" font-size="12.4" fill="#3d4a63" fill-opacity="0.92">A field can both change type and tighten optional -&gt; required.</text><text x="66" y="809.4" font-size="12.4" fill="#3d4a63" fill-opacity="0.92">Independent checks, so a single field emits two changes at once.</text><text x="66" y="827.8" font-size="12.4" fill="#3d4a63" fill-opacity="0.92">The stable sort keys on (kind, field) only, so the type change stays first.</text><rect x="775" y="745" width="735" height="95.19999999999999" rx="11" fill="#e3f5ec" stroke="#2f9e6e" stroke-width="1.4" stroke-opacity="0.8"/><text x="791" y="769" font-size="13.2" font-weight="700" fill="#186547">Conservative on purpose</text><text x="791" y="791" font-size="12.4" fill="#186547" fill-opacity="0.92">Loosening a constraint is safe; tightening one breaks - that is the point.</text><text x="791" y="809.4" font-size="12.4" fill="#186547" fill-opacity="0.92">A rename reads as remove + add; type equality is exact (no widening).</text><text x="791" y="827.8" font-size="12.4" fill="#186547" fill-opacity="0.92">Not a registry, migration generator, or semantic differ - all by design.</text><text x="780.0" y="882" text-anchor="middle" font-size="12" fill="#6b7794">parag-labs/schema-guard</text></svg>